<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#050a18">
  <meta name="color-scheme" content="dark">
  <!-- Seguridad (ver SEGURIDAD.md): solo se cargan scripts y conexiones de orígenes conocidos. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://script.google.com https://script.googleusercontent.com http://127.0.0.1:8085; manifest-src 'self'; frame-src 'none'; object-src 'none'; worker-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="canonical" href="{{url}}">

  <!-- Open Graph / redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CO">
  <meta property="og:site_name" content="Funcode Studio CB">
  <meta property="og:title" content="{{social_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{site}}assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Funcode Studio CB: desarrollamos soluciones digitales y productos tecnológicos">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{social_title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{site}}assets/img/og-image.jpg">

  <!-- Iconos y manifest -->
  <link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animaciones.css">
  <link rel="stylesheet" href="css/chat.css">
  <script>document.documentElement.classList.add('js');</script>
{{extra_head}}</head>
