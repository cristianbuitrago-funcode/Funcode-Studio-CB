  <!-- Funi, la mascota (js/animaciones.js la muestra y la mueve con la página) -->
  <div class="mascota" id="mascota" hidden>
    <p class="mascota-bubble" id="mascota-bubble"></p>
    <button class="mascota-btn" type="button" aria-label="Funi, la mascota de Funcode. Toca para ver un dato">
      <svg class="funi" viewBox="0 0 120 150" aria-hidden="true" focusable="false">
        <g class="fu-flame"><path class="fu-flame-out" d="M49 112Q60 150 71 112Z"/><path class="fu-flame-in" d="M54 112Q60 134 66 112Z"/></g>
        <g class="fu-all">
          <g class="fu-arm fu-arm-l"><path d="M24 74Q10 66 9 52"/><circle cx="9" cy="49" r="6"/></g>
          <g class="fu-arm fu-arm-r"><path d="M96 74Q110 82 110 96"/><circle cx="110" cy="99" r="6"/></g>
          <g class="fu-antenna"><path d="M60 24V11"/><circle cx="60" cy="8" r="6"/></g>
          <rect class="fu-jet" x="48" y="102" width="24" height="10" rx="3"/>
          <rect class="fu-body" x="18" y="22" width="84" height="84" rx="32"/>
          <path class="fu-shine" d="M33 38q8-9 22-9"/>
          <rect class="fu-face" x="30" y="37" width="60" height="44" rx="18"/>
          <g class="fu-eye-open">
            <circle class="fu-eye" cx="47" cy="58" r="7.5"/><circle class="fu-eye" cx="73" cy="58" r="7.5"/>
            <g class="fu-pupils"><circle cx="47" cy="58" r="3.2"/><circle cx="73" cy="58" r="3.2"/></g>
          </g>
          <g class="fu-eye-happy"><path d="M40 61q7-9 14 0M66 61q7-9 14 0"/></g>
          <g class="fu-eye-sleep"><path d="M40 59h14M66 59h14"/></g>
          <path class="fu-mouth" d="M53 70q7 6 14 0"/>
          <ellipse class="fu-mouth-open" cx="60" cy="72" rx="5" ry="4"/>
          <circle class="ch-cheek" cx="36" cy="72" r="4"/><circle class="ch-cheek" cx="84" cy="72" r="4"/>
          <text class="fu-chest" x="60" y="98">&lt;/&gt;</text>
          <g class="fu-zz"><text x="94" y="32">z</text><text x="104" y="18">z</text></g>
        </g>
      </svg>
    </button>
    <button class="mascota-close" type="button" aria-label="Ocultar a Funi"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
